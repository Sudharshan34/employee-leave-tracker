<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Employee Leave Tracker{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
        <a class="navbar-brand" href="{% url 'home' %}">Leave Tracker</a>
        <div class="navbar-nav">
            {% if user.is_authenticated %}
                {% if user.role == 'employee' %}
                    <a class="nav-link text-white" href="{% url 'my_leaves' %}">My Leaves</a>
                    <a class="nav-link text-white" href="{% url 'apply_leave' %}">Apply for Leave</a>
                {% else %}
                    <a class="nav-link text-white" href="{% url 'manage_leaves' %}">Manage Leaves</a>
                {% endif %}
                <span class="nav-link text-white">{{ user.username }} ({{ user.role }})</span>
                <a class="nav-link text-white" href="{% url 'logout' %}">Logout</a>
            {% else %}
                <a class="nav-link text-white" href="{% url 'login' %}">Login</a>
                <a class="nav-link text-white" href="{% url 'register' %}">Register</a>
            {% endif %}
        </div>
    </nav>
    <div class="container mt-4">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
